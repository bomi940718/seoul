<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<script>
// 화면 깜빡임 방지: 스타일 적용 전에 테마를 먼저 확정한다
(function(){
  try {
    var v = localStorage.getItem("workreport.theme");
    if (v === "dark" || v === "light") document.documentElement.setAttribute("data-theme", v);
  } catch(e) {}
})();
</script>
<style>
  /* ── 색 토큰: 밝은 화면 기본 ─────────── */
  :root {
    --bg:#f5f6f8; --card:#fff; --bd:#e3e6ec; --sh:rgba(16,24,40,.04);
    --tx:#1f2430; --tx2:#4b5563; --tx3:#6b7280; --tx4:#9ca3af; --tx5:#b0b6c1;
    --hov:#f9fafb; --btnbd:#d1d5db; --line:#eef0f4; --line2:#dfe3ea;
    --on-bg:#1f2937; --on-fg:#fff;
    --lk:#2563eb; --ring:#bfdbfe; --ringbd:#60a5fa;
    --a0-bg:#dbeafe; --a0-fg:#1d4ed8;
    --a1-bg:#ede9fe; --a1-fg:#6d28d9;
  }
  /* 시스템이 어두운 화면일 때 (사용자가 밝게 고정하지 않은 경우) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151a; --card:#1a1f27; --bd:#2a313c; --sh:rgba(0,0,0,.4);
      --tx:#e5e9f0; --tx2:#b8c1cf; --tx3:#98a2b3; --tx4:#7a8496; --tx5:#5e6878;
      --hov:#222834; --btnbd:#3a4351; --line:#242b35; --line2:#333c49;
      --on-bg:#e5e9f0; --on-fg:#12151a;
      --lk:#7dd3fc; --ring:#1e3a5f; --ringbd:#3b82f6;
      --a0-bg:#1e2f4d; --a0-fg:#93c5fd;
      --a1-bg:#2a2445; --a1-fg:#c4b5fd;
    }
  }
  /* 사용자가 직접 어둡게 고른 경우 */
  :root[data-theme="dark"] {
    --bg:#12151a; --card:#1a1f27; --bd:#2a313c; --sh:rgba(0,0,0,.4);
    --tx:#e5e9f0; --tx2:#b8c1cf; --tx3:#98a2b3; --tx4:#7a8496; --tx5:#5e6878;
    --hov:#222834; --btnbd:#3a4351; --line:#242b35; --line2:#333c49;
    --on-bg:#e5e9f0; --on-fg:#12151a;
    --lk:#7dd3fc; --ring:#1e3a5f; --ringbd:#3b82f6;
    --a0-bg:#1e2f4d; --a0-fg:#93c5fd;
    --a1-bg:#2a2445; --a1-fg:#c4b5fd;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'Malgun Gothic','Segoe UI',sans-serif;
    background:var(--bg); color:var(--tx);
    font-size:14px; line-height:1.6;
  }
  a { color:var(--lk); text-decoration:none; word-break:break-all; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }

  /* ── 헤더 ─────────────────────────── */
  .hd { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:18px 22px; margin-bottom:12px; }
  .hd .num { font-size:12px; color:var(--tx3); letter-spacing:.4px; }
  .hd h1 { font-size:21px; font-weight:700; margin:2px 0 10px; }
  .hd .stats { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:var(--tx2); align-items:center; }
  .hd .stats b { color:var(--tx); font-weight:700; }
  .hd .upd { margin-left:auto; color:var(--tx4); font-size:12px; }
  .hd .back { font-size:12.5px; }

  /* ── 필터 바 ───────────────────────── */
  .fbar {
    position:sticky; top:0; z-index:10;
    background:var(--card); border:1px solid var(--bd); border-radius:10px;
    padding:10px 12px; margin-bottom:14px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    box-shadow:0 2px 6px var(--sh);
  }
  .fbar input[type=search] {
    flex:1 1 200px; min-width:160px;
    padding:7px 10px; border:1px solid var(--btnbd); border-radius:7px;
    font:inherit; font-size:13.5px; background:var(--card); color:var(--tx);
  }
  .fbar select, .fbar input[type=date] {
    padding:6.5px 8px; border:1px solid var(--btnbd); border-radius:7px;
    font:inherit; font-size:13px; background:var(--card); color:var(--tx);
  }
  .fbar input:focus, .fbar select:focus { outline:2px solid var(--ring); border-color:var(--ringbd); }
  .fbar .tilde { color:var(--tx4); }
  .fbar .cnt { font-size:12.5px; color:var(--tx3); margin-left:auto; white-space:nowrap; }
  .fbar .reset, .fbar .tg {
    border:1px solid var(--btnbd); background:var(--hov); border-radius:7px;
    padding:6.5px 10px; font:inherit; font-size:12.5px; color:var(--tx2); cursor:pointer;
  }
  .fbar .reset:hover, .fbar .tg:hover { background:var(--bd); }
  .fbar .tg.on { background:var(--on-bg); border-color:var(--on-bg); color:var(--on-fg); }

  /* ── 행 카드 리스트 ─────────────────── */
  .list { background:var(--card); border:1px solid var(--bd); border-radius:10px; overflow:hidden; }
  .row { display:flex; gap:12px; padding:11px 16px; border-top:1px solid var(--line); }
  .row:first-child { border-top:none; }
  .row.newdate { border-top:2px solid var(--line2); }
  .row:first-child.newdate { border-top:none; }

  .dt { flex:0 0 118px; font-size:13px; font-weight:700; color:var(--tx2); padding-top:1px; white-space:nowrap; }
  .dt .dow { font-weight:400; color:var(--tx4); font-size:12px; margin-left:2px; }
  .dt.ghost { visibility:hidden; }

  /* 작성자·담당·시간 열 (내용 앞) */
  .who { flex:0 0 190px; min-width:0; font-size:11.5px; color:var(--tx3); line-height:1.5; }
  .who .chip { margin-bottom:3px; }
  .who div { word-break:break-word; }
  .who .lb { color:var(--tx5); }

  .bd { flex:1; min-width:0; }
  .desc { white-space:normal; word-break:break-word; }
  .desc.clamp {
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  .more {
    border:none; background:none; color:var(--lk); cursor:pointer;
    font:inherit; font-size:12.5px; padding:2px 0; display:none;
  }
  .chip {
    display:inline-block; padding:1px 8px; border-radius:9px; font-size:11.5px; font-weight:700;
  }
  .chip.a0 { background:var(--a0-bg); color:var(--a0-fg); }
  .chip.a1 { background:var(--a1-bg); color:var(--a1-fg); }

  .empty { padding:46px 16px; text-align:center; color:var(--tx4); font-size:13.5px; }
  .foot { margin-top:14px; text-align:center; color:var(--tx5); font-size:11.5px; }

  @media (max-width:720px) {
    .dt { flex-basis:96px; font-size:11.5px; }
    .who { flex-basis:110px; }
    .row { padding:10px 10px; gap:8px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hd">
    <div class="num" id="hNum"></div>
    <h1 id="hName"></h1>
    <div class="stats">
      <span>총 <b id="sTotal"></b>건</span>
      <span id="sByAuthor"></span>
      <span class="upd">마지막 갱신: <span id="sUpd"></span></span>
      <span class="back"><a href="../index.html">← 대시보드</a></span>
    </div>
  </div>

  <div class="fbar">
    <input type="search" id="fText" placeholder="검색 (내용·담당·비고)" autocomplete="off">
    <select id="fAuthor"><option value="">작성자: 전체</option></select>
    <select id="fStatus">
      <option value="">여부: 전체</option>
      <option value="O">O</option>
      <option value="△">△</option>
      <option value="X">X</option>
      <option value="-">미기재</option>
    </select>
    <button class="tg" id="fHideX" title="실행되지 않은(X) 기록을 숨겨 실행된 것만 봅니다">실행 X 숨기기</button>
    <input type="date" id="fFrom"><span class="tilde">~</span><input type="date" id="fTo">
    <button class="reset" id="fReset">초기화</button>
    <button class="tg" id="fTheme" title="밝은 화면 / 어두운 화면 전환"></button>
    <span class="cnt" id="fCnt"></span>
  </div>

  <div class="list" id="list"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
var META = @@META_JSON@@;
var DATA = @@DATA_JSON@@;

// ── 유틸 ──────────────────────────────
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
// escape 후 적용: URL 자동 링크화 + 줄바꿈 <br>
function rich(s){
  var e = esc(s);
  e = e.replace(/(https?:\/\/[^\s<>&"']+[^\s<>&"'.,)\]])/g,
    '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return e.replace(/\r?\n/g,"<br>");
}
function statusKey(st){
  st = (st||"").trim().toUpperCase();
  if(st==="O"||st==="0"||st==="○") return "O"; // ○ 허용
  if(st==="△") return "△";
  if(st==="X") return "X";
  return "-";
}
// 여부(K열)나 실행(L열) 중 하나라도 X 면 "실행되지 않음"으로 본다
function isNotDone(r){
  return statusKey(r.st)==="X" || statusKey(r.pl)==="X";
}

// ── 어두운 화면 전환 ───────────────────
var themeBtn = document.getElementById("fTheme");
function curTheme(){
  var v = document.documentElement.getAttribute("data-theme");
  if(v) return v;
  return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function paintThemeBtn(){ themeBtn.textContent = curTheme()==="dark" ? "☀ 밝게" : "🌙 어둡게"; }
themeBtn.addEventListener("click", function(){
  var next = curTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("workreport.theme", next); } catch(e) {}
  paintThemeBtn();
});
paintThemeBtn();

// ── 헤더 채우기 ────────────────────────
document.getElementById("hNum").textContent = META.number;
document.getElementById("hName").textContent = META.name;
document.title = META.number + " · " + META.name + " — 워크리포트";
document.getElementById("sTotal").textContent = DATA.length;
document.getElementById("sUpd").textContent = META.generatedAt;
(function(){
  var parts = [];
  for(var i=0;i<META.authors.length;i++){
    var n = 0;
    for(var j=0;j<DATA.length;j++) if(DATA[j].a===i) n++;
    parts.push(META.authors[i]+" "+n+"건");
  }
  document.getElementById("sByAuthor").textContent = parts.join(" · ");
  var sel = document.getElementById("fAuthor");
  META.authors.forEach(function(a,i){
    var o = document.createElement("option");
    o.value = String(i); o.textContent = a;
    sel.appendChild(o);
  });
})();
document.getElementById("foot").textContent =
  "이 파일은 자동 생성됩니다 — 직접 수정하지 마세요 · " + META.generatedAt;

// ── 필터 + 렌더 ────────────────────────
var els = {
  text: document.getElementById("fText"),
  author: document.getElementById("fAuthor"),
  status: document.getElementById("fStatus"),
  hideX: document.getElementById("fHideX"),
  from: document.getElementById("fFrom"),
  to: document.getElementById("fTo"),
  cnt: document.getElementById("fCnt"),
  list: document.getElementById("list")
};
var hideX = false;

function pass(r){
  var q = els.text.value.trim().toLowerCase();
  if(q){
    var hay = (r.ds+"\n"+r.rg+"\n"+r.os+"\n"+r.ml+"\n"+r.pl+"\n"+r.nt).toLowerCase();
    var terms = q.split(/\s+/);
    for(var i=0;i<terms.length;i++) if(hay.indexOf(terms[i])<0) return false;
  }
  if(els.author.value!=="" && r.a!==Number(els.author.value)) return false;
  if(els.status.value!=="" && statusKey(r.st)!==els.status.value) return false;
  if(hideX && isNotDone(r)) return false;
  if(els.from.value && r.d<els.from.value) return false;
  if(els.to.value && r.d>els.to.value) return false;
  return true;
}

function render(){
  var html = [], shown = 0, prevDate = null;
  for(var i=0;i<DATA.length;i++){
    var r = DATA[i];
    if(!pass(r)) continue;
    shown++;
    var isNew = r.d!==prevDate;
    // 행 구성: 날짜(연도 포함) | 작성자·담당·시간 등 | 내용 (내용 열에는 Descriptions만)
    var who = ['<div><span class="chip a'+r.a+'">'+esc(META.authors[r.a]||"?")+"</span></div>"];
    var org = [r.rg, r.os].filter(Boolean).join(" ");
    if(org) who.push("<div>"+esc(org)+"</div>");
    if(r.ml) who.push("<div>"+rich(r.ml)+"</div>");
    if(r.sc) who.push('<div><span class="lb">시각</span> '+esc(r.sc)+"</div>");
    if(r.pl) who.push('<div><span class="lb">실행</span> '+rich(r.pl)+"</div>");
    if(r.nt) who.push('<div><span class="lb">비고</span> '+rich(r.nt)+"</div>");
    html.push(
      '<div class="row'+(isNew?" newdate":"")+'">',
      '<div class="dt'+(isNew?"":" ghost")+'">'+r.d+'<span class="dow">('+r.w+")</span></div>",
      '<div class="who">'+who.join("")+"</div>",
      '<div class="bd"><div class="desc clamp">'+rich(r.ds)+"</div>",
      '<button class="more">더보기</button></div>',
      "</div>");
    prevDate = r.d;
  }
  els.list.innerHTML = shown ? html.join("")
    : '<div class="empty">조건에 맞는 기록이 없습니다.</div>';
  els.cnt.textContent = shown===DATA.length ? DATA.length+"건" : shown+" / "+DATA.length+"건";

  // 3줄 초과만 "더보기" 노출
  var descs = els.list.querySelectorAll(".desc");
  for(var k=0;k<descs.length;k++){
    if(descs[k].scrollHeight > descs[k].clientHeight+2){
      descs[k].nextElementSibling.style.display = "inline-block";
    }
  }
}

els.list.addEventListener("click", function(e){
  if(!e.target.classList.contains("more")) return;
  var d = e.target.previousElementSibling;
  var open = d.classList.toggle("clamp");
  e.target.textContent = open ? "더보기" : "접기";
});

els.hideX.addEventListener("click", function(){
  hideX = !hideX;
  els.hideX.className = "tg" + (hideX ? " on" : "");
  render();
});

["input","change"].forEach(function(ev){
  els.text.addEventListener(ev, render);
  els.author.addEventListener(ev, render);
  els.status.addEventListener(ev, render);
  els.from.addEventListener(ev, render);
  els.to.addEventListener(ev, render);
});
document.getElementById("fReset").addEventListener("click", function(){
  els.text.value=""; els.author.value=""; els.status.value="";
  els.from.value=""; els.to.value="";
  hideX = false; els.hideX.className = "tg";
  render();
});

render();
</script>
</body>
</html>
