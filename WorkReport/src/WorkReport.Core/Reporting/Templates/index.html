<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>워크리포트 대시보드</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Malgun Gothic','Segoe UI',sans-serif;
    background:#f5f6f8; color:#1f2430; font-size:14px; line-height:1.6;
  }
  a { text-decoration:none; color:inherit; }
  .wrap { max-width:1000px; margin:0 auto; padding:24px 16px 60px; }

  .hd { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin-bottom:14px; }
  .hd h1 { font-size:22px; font-weight:700; }
  .hd .sub { color:#6b7280; font-size:12.5px; }
  .hd .upd { margin-left:auto; color:#9ca3af; font-size:12px; }

  /* ── 필터 바: 그룹 + 상태 ─────────────── */
  .fbar {
    background:#fff; border:1px solid #e3e6ec; border-radius:10px;
    padding:10px 14px; margin-bottom:18px;
    display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center;
  }
  .fbar .lb { font-size:12px; color:#9ca3af; margin-right:2px; }
  .fbar .sep { width:1px; height:18px; background:#e5e7eb; margin:0 6px; }
  .tg {
    border:1px solid #d1d5db; background:#fff; color:#4b5563;
    border-radius:14px; padding:3px 12px; font:inherit; font-size:12.5px; cursor:pointer;
  }
  .tg:hover { background:#f9fafb; }
  .tg.on { background:#1f2937; border-color:#1f2937; color:#fff; }
  .tg .n { opacity:.65; font-size:11px; margin-left:3px; }

  /* ── 그룹 섹션 ───────────────────────── */
  .grp { margin-bottom:22px; }
  .grp h2 {
    font-size:13.5px; font-weight:700; color:#4b5563;
    margin:0 0 8px 2px; display:flex; align-items:center; gap:8px;
  }
  .grp h2 .n { font-weight:400; color:#9ca3af; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }

  .card {
    background:#fff; border:1px solid #e3e6ec; border-radius:10px;
    padding:15px 18px; display:block; position:relative;
    transition:box-shadow .12s, transform .12s;
  }
  .card:hover { box-shadow:0 4px 14px rgba(16,24,40,.08); transform:translateY(-1px); }
  .card .num { font-size:11.5px; color:#6b7280; letter-spacing:.4px; padding-right:44px; }
  .card h3 { font-size:16px; font-weight:700; margin:2px 0 10px; word-break:break-all; }
  .card .row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card .total { font-size:13px; color:#374151; }
  .card .total b { font-size:16px; color:#111827; }
  .pill {
    display:inline-flex; align-items:center; gap:3px;
    font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:9px;
  }
  .pill.o { background:#dcfce7; color:#15803d; }
  .pill.t { background:#ffedd5; color:#c2410c; }
  .pill.x { background:#fee2e2; color:#b91c1c; }
  .pill.n { background:#f3f4f6; color:#6b7280; }
  .card .last { margin-top:9px; font-size:12px; color:#9ca3af; }
  .card .last b { color:#4b5563; font-weight:700; }

  .st { position:absolute; top:12px; right:12px; font-size:11px; font-weight:700;
        padding:1px 8px; border-radius:9px; }
  .st.plan { background:#e0f2fe; color:#0369a1; }
  .st.done { background:#f3f4f6; color:#6b7280; }
  .card.done { opacity:.6; }

  .empty { padding:60px 0; text-align:center; color:#9ca3af; }
  .foot { margin-top:20px; text-align:center; color:#b0b6c1; font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>워크리포트</h1>
    <span class="sub" id="hSub"></span>
    <span class="upd">마지막 갱신: <span id="hUpd"></span></span>
  </div>

  <div class="fbar">
    <span class="lb">그룹</span><span id="fGroups"></span>
    <span class="sep"></span>
    <span class="lb">상태</span><span id="fStatus"></span>
  </div>

  <div id="sections"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
"use strict";
var META = @@META_JSON@@;
var PROJECTS = @@DATA_JSON@@;

function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.getElementById("hUpd").textContent = META.generatedAt;
document.getElementById("foot").textContent =
  "이 파일은 자동 생성됩니다 — 직접 수정하지 마세요 · " + META.generatedAt;

// ── 필터 상태: 그룹 = 전체 또는 특정 1개 / 상태 = 다중 토글 (완료는 기본 숨김) ──
var groups = [];
PROJECTS.forEach(function(p){ if(groups.indexOf(p.group)<0) groups.push(p.group); });
var curGroup = "";                                // "" = 전체
var stOn = { "계획":true, "진행":true, "완료":false };

function makeToggle(label, count, on, onClick){
  var b = document.createElement("button");
  b.className = "tg" + (on ? " on" : "");
  b.innerHTML = esc(label) + (count!=null ? '<span class="n">'+count+"</span>" : "");
  b.addEventListener("click", onClick);
  return b;
}

function renderFilters(){
  var g = document.getElementById("fGroups");
  g.innerHTML = "";
  g.appendChild(makeToggle("전체", null, curGroup==="", function(){ curGroup=""; renderAll(); }));
  groups.forEach(function(name){
    var cnt = PROJECTS.filter(function(p){ return p.group===name; }).length;
    g.appendChild(makeToggle(name, cnt, curGroup===name, function(){
      curGroup = (curGroup===name) ? "" : name;
      renderAll();
    }));
  });

  var s = document.getElementById("fStatus");
  s.innerHTML = "";
  ["계획","진행","완료"].forEach(function(st){
    var cnt = PROJECTS.filter(function(p){ return p.status===st; }).length;
    s.appendChild(makeToggle(st, cnt, stOn[st], function(){
      stOn[st] = !stOn[st];
      renderAll();
    }));
  });
}

function cardHtml(p){
  var stCls = p.status==="계획" ? "plan" : (p.status==="완료" ? "done" : "");
  return [
    '<a class="card'+(p.status==="완료"?" done":"")+'" href="'+esc(p.file)+'">',
    (stCls ? '<span class="st '+stCls+'">'+esc(p.status)+"</span>" : ""),
    '<div class="num">'+esc(p.number)+"</div>",
    "<h3>"+esc(p.name)+"</h3>",
    '<div class="row1">',
    '<span class="total">총 <b>'+p.total+"</b>건</span>",
    '<span class="pill o">O '+p.o+"</span>",
    '<span class="pill t">△ '+p.tri+"</span>",
    '<span class="pill x">X '+p.x+"</span>",
    (p.blank ? '<span class="pill n">· '+p.blank+"</span>" : ""),
    "</div>",
    '<div class="last">마지막 기록 <b>'+(p.last||"없음")+"</b></div>",
    "</a>"].join("");
}

function renderAll(){
  renderFilters();

  var visible = PROJECTS.filter(function(p){
    if(curGroup && p.group!==curGroup) return false;
    return !!stOn[p.status];
  });
  document.getElementById("hSub").textContent =
    "프로젝트 " + visible.length + (visible.length===PROJECTS.length ? "개" : " / " + PROJECTS.length + "개");

  var html = [];
  groups.forEach(function(name){
    var items = visible.filter(function(p){ return p.group===name; });
    if(items.length===0) return;
    html.push('<div class="grp"><h2>'+esc(name)+'<span class="n">'+items.length+"개</span></h2>");
    html.push('<div class="grid">');
    items.forEach(function(p){ html.push(cardHtml(p)); });
    html.push("</div></div>");
  });
  document.getElementById("sections").innerHTML =
    html.length ? html.join("") : '<div class="empty">표시할 프로젝트가 없습니다.</div>';
}

renderAll();
</script>
</body>
</html>
